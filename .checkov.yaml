# Checkov configuration.
#
# Policy: findings are fixed, not silenced. Every entry below is an accepted
# risk with a stated reason. The scan runs as a hard gate in CI *before*
# terraform apply - see .github/workflows/deploy.yml.
#
# Nothing here is suppressed to make the build green. Where a check is skipped
# because a feature is deliberately out of scope, that is said plainly.

# Do not call the Prisma Cloud guidelines API: an external dependency the
# pipeline does not need, which fails noisily on restricted networks.
skip-download: true

framework:
  - terraform

directory:
  - .

skip-path:
  - .terraform
  - .build

skip-check:
  # -------------------------------------------------------------------------
  # Optional hardening listed as BONUS in the brief and deliberately not
  # implemented in this build. Each is a real gap, not a false positive; they
  # are enumerated here so the scope decision is explicit rather than hidden.
  # -------------------------------------------------------------------------
  - CKV_AWS_119  # DynamoDB encrypted with a customer managed key. The table
                 # uses SSE with the AWS managed key, which satisfies the
                 # mandatory encryption requirement. A CMK was the bonus.
  - CKV_AWS_117  # Lambda inside a VPC. The function talks only to DynamoDB and
                 # CloudWatch over the AWS network; a dedicated VPC was the
                 # bonus.
  - CKV2_AWS_53  # Request validated at the gateway. Validation is enforced in
                 # the handler, which is what the brief requires: a missing
                 # payload key returns 400. Rejecting at the edge was the bonus.
  - CKV_AWS_59   # Open access to the backend. The endpoint is intentionally
                 # unauthenticated in this build; API key auth was the bonus.
                 # Exposure is bounded by stage throttling and by the
                 # function's reserved concurrency.
  - CKV_AWS_158  # CloudWatch log group encrypted with KMS. Depends on the CMK
                 # above; logs are encrypted at rest with an AWS managed key.
  - CKV_AWS_173  # Lambda environment variables encrypted with a CMK. They hold
                 # only non-secret configuration - table name, environment,
                 # TTL. Any real secret would go to Secrets Manager.

  # -------------------------------------------------------------------------
  # Cost-driven acceptances. Single-region project, low traffic.
  # -------------------------------------------------------------------------
  - CKV2_AWS_29  # WAF in front of API Gateway. Stage throttling covers the
                 # stated DDoS requirement; a Web ACL is ~USD 5/month plus
                 # per-rule charges.
  - CKV_AWS_120  # API Gateway caching. A health endpoint must return live
                 # results, so caching it would be wrong as well as chargeable.
  - CKV_AWS_225  # API Gateway method-level caching. Same reasoning.
  - CKV_AWS_338  # 365-day log retention. Retention is a per-environment
                 # variable (14d staging, 90d prod) chosen for cost. There is no
                 # compliance driver for a year of health check logs.
  - CKV_AWS_144  # Cross-region replication of the state bucket. Single-region
                 # project; versioning provides the recovery path.
  - CKV_AWS_18   # S3 access logging on the state bucket. Would require a second
                 # bucket to hold the logs; state access is already audited
                 # through CloudTrail.

  # -------------------------------------------------------------------------
  # Not applicable to this architecture.
  # -------------------------------------------------------------------------
  - CKV_AWS_116  # Lambda DLQ. The function is synchronous behind API Gateway;
                 # failures surface to the caller as 5xx and to CloudWatch. A
                 # DLQ only collects events for asynchronous invocations.
  - CKV_AWS_272  # Lambda code signing. Requires a Signer profile; out of scope.
  - CKV2_AWS_51  # Client certificate authentication to the backend. Not
                 # applicable to an AWS_PROXY Lambda integration.
  - CKV_AWS_145  # KMS encryption of the state bucket. AES256 SSE-S3 is enabled;
                 # a CMK here would create a bootstrap dependency loop, since
                 # the key would need the state the bucket holds.
  - CKV2_AWS_62  # S3 event notifications. Nothing consumes state-change events.
